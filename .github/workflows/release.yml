name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            zip-suffix: windows-x64
            dll: bethkit_ffi.dll

          - os: ubuntu-latest
            label: linux-x64
            zip-suffix: linux-x64
            dll: libbethkit_ffi.so

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Require an explicitly pinned published native release
        run: uv run python scripts/native_artifacts.py describe --require-release

      - name: Download exact checksum-pinned native release assets
        run: >-
          uv run python scripts/native_artifacts.py fetch-release
          --platform ${{ matrix.label }} --destination build/native-release

      - name: Require real native integration
        run: uv run pytest tests/ --require-native

      - name: Verify generated models against the pinned schema
        shell: bash
        run: >-
          uv run python scripts/generate_records.py
          --schema "$BETHKIT_SCHEMA" --output src/bethkit/records/skyrim_se --check

      - name: Build wheel
        run: uv build --wheel

      - name: Repair Linux wheel and verify external dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf
          uv tool run --from auditwheel auditwheel repair --wheel-dir wheelhouse dist/*.whl
          uv tool run --from auditwheel auditwheel show wheelhouse/*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.label }}
          path: ${{ runner.os == 'Linux' && 'wheelhouse/*.whl' || 'dist/*.whl' }}
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC Trusted Publisher

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - uses: astral-sh/setup-uv@v5

      - name: Publish
        run: uv publish

  publish-github:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/*.whl
