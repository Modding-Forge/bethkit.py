name: Build

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  file-length-policy:
    name: File length policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Enforce the 400-line file policy before installing dependencies
        run: python scripts/check_file_lengths.py --revision HEAD

  lint:
    name: Lint
    needs: file-length-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/ scripts/

      - name: Ruff format
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Pyright
        run: uv run pyright src/ tests/ scripts/

      - name: Unit tests without native downloads
        run: uv run pytest tests/ -m "not integration"

  build:
    needs: lint
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            zip-suffix: windows-x64
            dll: bethkit_ffi.dll

          - os: ubuntu-latest
            label: linux-x64
            zip-suffix: linux-x64
            dll: libbethkit_ffi.so

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Read immutable native source pin
        id: native
        run: uv run python scripts/native_artifacts.py describe

      - name: Check out the required native revision
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.native.outputs.repository }}
          ref: ${{ steps.native.outputs.revision }}
          path: build/native-source

      - uses: dtolnay/rust-toolchain@stable

      - name: Download checksum-pinned Skyrim SE schema
        shell: pwsh
        run: |
          $schema = ./build/native-source/scripts/Get-SkyrimSeSchema.ps1
          "BETHKIT_SKYRIM_SE_SCHEMA=$schema" >> $env:GITHUB_ENV

      - name: Build pinned native library with Skyrim SE only
        working-directory: build/native-source
        run: cargo build --locked --release -p bethkit-ffi --features schema-skyrim-se

      - name: Configure explicit native inputs
        run: >-
          uv run python scripts/native_artifacts.py configure
          --library build/native-source/target/release/${{ matrix.dll }}
          --schema build/native-source/target/release-schemas/skyrim_se.bkschema

      - name: Require real native integration
        run: uv run pytest tests/ --require-native

      - name: Verify generated models against the pinned schema
        shell: bash
        run: >-
          uv run python scripts/generate_records.py
          --schema "$BETHKIT_SCHEMA" --output src/bethkit/records/skyrim_se --check

      - name: Build wheel
        run: uv build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error
