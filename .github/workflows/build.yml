name: Build

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv tool run ruff check src/ tests/

      - name: Pyright
        run: uv tool run pyright src/ tests/

  build:
    needs: lint
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            zip-suffix: windows-x64
            dll: bethkit_ffi.dll

          - os: ubuntu-latest
            label: linux-x64
            zip-suffix: linux-x64
            dll: libbethkit_ffi.so

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --extra dev

      # Download the native library from the latest bethkit GitHub release.
      # The ZIP has a flat layout: the DLL sits directly at the root.
      - name: Download bethkit native library
        shell: bash
        run: |
          BROWSER_URL=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Modding-Forge/bethkit/releases/latest \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          suffix = '${{ matrix.zip-suffix }}'
          for a in data.get('assets', []):
              if a['name'].endswith(f'-{suffix}.zip'):
                  print(a['browser_download_url'])
                  break
          ")
          curl -fsSL -o native.zip "$BROWSER_URL"
          unzip -j native.zip "${{ matrix.dll }}" -d src/bethkit/
          # On Windows, $(pwd) returns a Unix-style path that PowerShell
          # cannot resolve. cygpath converts it to a Windows path.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            WIN_PATH=$(cygpath -w "$(pwd)/src/bethkit/${{ matrix.dll }}")
            echo "BETHKIT_LIB=$WIN_PATH" >> "$GITHUB_ENV"
          else
            echo "BETHKIT_LIB=$(pwd)/src/bethkit/${{ matrix.dll }}" >> "$GITHUB_ENV"
          fi

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Build wheel
        run: uv build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error
