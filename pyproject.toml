[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[project]
name = "bethkit"
version = "1.0.0"
description = "Python bindings for bethkit — a Bethesda plugin and archive toolkit"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["bethesda", "skyrim", "fallout", "esp", "esm", "bsa", "ba2", "modding"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["pydantic>=2.0"]
authors = [{ name = "Modding Forge", email = "info@moddingforge.com" }]

[project.urls]
Homepage = "https://moddingforge.com/"
Repository = "https://github.com/Modding-Forge/bethkit.py"

[project.optional-dependencies]
dev = [
    "pyright",
    "ruff",
    "pytest>=7",
    "pytest-mock",
    "pytest-cov",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportPrivateUsage = false

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "N"]
ignore = [
    "UP045",   # Optional[T] is required by project conventions
]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = ["E501"]  # generated stubs may have long docstring lines

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
log_cli = true
log_cli_level = "DEBUG"
addopts = "-vv"
markers = ["integration: requires real bethkit_ffi library"]
